[package]
name        = "config-nv"
version     = "0.1.0"
description = "The half of a configuration library that touches the machine: files read by path and dispatched on extension to toml-nv, yaml-nv or std.json, the process environment behind a prefix, a .env file with the dotenv grammar, and command-line overrides — each producing one config-core-nv layer, stacked in a declared order."
license     = "Apache-2.0"
stability   = "experimental"

# `host`, and the rows are the disclosure.  They are not all the same:
# reading a file is `[fs]`, reading the process environment is `[io]`
# because SPEC § 5.1 puts the environment there, and the format
# adapters and the override layer declare NOTHING — they are here
# because this is where the parsers are, not because they perform
# anything.  A caller in a sandbox that grants one label and not the
# other can see which calls they still have before they write them.
layer       = "host"

category    = "tooling"

tags        = ["config", "configuration", "dotenv", "env", "toml", "yaml", "layered"]
repository  = "https://github.com/novolang/config-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.23.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "Reading configuration off the machine"

[dependencies]
# The `core` half of the split, and the direction the layer order
# allows: a `host` package may depend on a `core` one, which is what
# keeps the merge algebra testable with no file in the room.  Every
# dependency below resolves from the registry — a path line is refused
# by `novo pkg publish`, `--dry-run` included, because the tarball
# would carry the path and send every consumer to a directory that is
# not on their machine.
config-core-nv = "^0.1.0"

# The two format parsers, from the registry.
#
# Under the caret rule a `0.x.y` version has no compatible neighbours:
# `^0.1.1` means exactly 0.1.1, and a republished parser needs this
# line edited.
toml-nv     = "^0.1.1"
yaml-nv     = "^0.1.1"

# JSON is `std.json` and costs no dependency at all.
